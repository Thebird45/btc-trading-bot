[project]
name = "btcbot"
version = "0.1.0"
description = "Bot de trading BTC/USDT: investigación, backtesting y simulación antes de operar con dinero real."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
btcbot = "btcbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btcbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
