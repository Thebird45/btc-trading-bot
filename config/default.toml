# Configuración base del bot. No poner secretos aquí: las claves API van en .env

[market]
exchange = "binance"
symbol = "BTCUSDT"
timeframe = "4h"
# Primer día con datos de BTCUSDT en Binance
history_start = "2017-08-17"

[costs]
# Comisión por lado (Binance Spot, nivel normal sin descuento BNB)
fee_rate = 0.001
# Deslizamiento estimado por lado, hipótesis conservadora
slippage_rate = 0.0005

[backtest]
initial_capital = 1000.0

[validation]
# Periodo final reservado (fuera de muestra). No se usa para diseñar ni ajustar
# estrategias: solo para la evaluación final con `btcbot backtest --holdout`.
holdout_start = "2025-01-01"

[risk]
# Fracción del capital que se arriesga por operación (distancia entrada → stop)
risk_per_trade = 0.005
# Máxima fracción del capital invertida en una posición (1.0 = sin apalancamiento)
max_position_fraction = 1.0

# Parámetros fijados ANTES de ver resultados (valores estándar, sin optimizar)
[strategy.ema_trend]
fast = 20
slow = 50
regime = 200
atr_period = 14
stop_atr = 2.5
