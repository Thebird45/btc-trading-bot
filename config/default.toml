# Configuración base del bot. No poner secretos aquí: las claves API van en .env

[market]
exchange = "binance"
symbol = "BTCUSDT"
timeframe = "4h"
# Primer día con datos de BTCUSDT en Binance
history_start = "2017-08-17"

[costs]
# Comisión por lado (Binance Spot, nivel normal sin descuento BNB)
fee_rate = 0.001
# Deslizamiento estimado por lado, hipótesis conservadora
slippage_rate = 0.0005

[backtest]
initial_capital = 1000.0

[validation]
# Periodo final reservado (fuera de muestra). No se usa para diseñar ni ajustar
# estrategias: solo para la evaluación final con `btcbot backtest --holdout`.
holdout_start = "2025-01-01"

[risk]
# Fracción del capital que se arriesga por operación (distancia entrada → stop)
risk_per_trade = 0.01
# Máxima fracción del capital invertida en una posición (1.0 = sin apalancamiento)
max_position_fraction = 1.0

# Parámetros fijados ANTES de ver resultados (valores estándar, sin optimizar)
[strategy.ema_trend]
fast = 20
slow = 50
regime = 200
atr_period = 14
stop_atr = 2.5

# Rejilla para robustez y walk-forward (fijada antes de ver resultados).
# 5 × 4 × 3 × 5 = 300 combinaciones alrededor de los valores base.
[grid.ema_trend]
fast = [10, 15, 20, 25, 30]
slow = [40, 50, 60, 80]
regime = [150, 200, 250]
stop_atr = [1.5, 2.0, 2.5, 3.0, 3.5]

[walkforward]
# Entrena 24 meses, prueba los 6 siguientes, avanza 6 meses. Todo antes del holdout.
train_months = 24
test_months = 6
first_test = "2019-07-01"
# Combinaciones con menos operaciones en el entrenamiento no se consideran
min_train_trades = 10

[paper]
# Base de datos con el estado del bot, operaciones, curva de capital y eventos
db_path = "data/paper.db"
initial_capital = 1000.0
# Si el capital cae este % desde el inicio del día (UTC), no se abren compras ese día
daily_loss_limit = 0.03
# Si la última vela cerrada llega con más de N velas de atraso, el bot no opera
max_stale_candles = 2
# Cada cuántos segundos revisa si cerró una vela nueva
poll_seconds = 30
# Zona horaria para mostrar fechas en avisos y en la web
display_tz = "America/Bogota"
# Enviar por Telegram un respaldo comprimido de la base tras cada resumen diario
telegram_backup = true

[web]
host = "127.0.0.1"
port = 8000
# Duración de la sesión iniciada
session_hours = 72
# Detrás de HTTPS (Caddy) poner WEB_SECURE_COOKIES=1 y WEB_TRUST_PROXY=1 en .env
