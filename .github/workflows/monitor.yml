name: monitor

# Revisa cada 30 minutos que el bot en producción esté vivo; si no, avisa por Telegram.
# Secretos del repo: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. Variable: HEALTH_URL.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar /health
        id: check
        run: |
          set +e
          body=$(curl -s --max-time 20 --retry 2 --retry-delay 15 -w '\n%{http_code}' "${{ vars.HEALTH_URL }}")
          code=$(echo "$body" | tail -1)
          status=$(echo "$body" | head -1 | sed -n 's/.*"status": *"\([^"]*\)".*/\1/p')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "status=${status:-sin respuesta}" >> "$GITHUB_OUTPUT"
          echo "HTTP $code — ${status:-sin respuesta}"
      - name: Avisar por Telegram si falla
        if: steps.check.outputs.code != '200'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ steps.check.outputs.status }}
          CODE: ${{ steps.check.outputs.code }}
        run: |
          curl -s -o /dev/null --max-time 20 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=🚨 Monitor: el bot no está sano (HTTP ${CODE}: ${STATUS}). Revisa el servidor: ssh ubuntu@IP 'cd btc-trading-bot && docker compose ps'"
          exit 1
